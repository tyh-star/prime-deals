name: Demo site

# Builds the frontend in demo mode (the API runs in the browser with sample data)
# and publishes it to the `gh-pages` branch. Turn on GitHub Pages for that branch
# to get a public link: Settings → Pages → Deploy from a branch → gh-pages / (root).

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/demo.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demo-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Build demo
        run: npm run build
        env:
          VITE_DEMO: 'true'
      - name: Publish to gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Demo build of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
